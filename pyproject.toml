[project]
name = "hangar"
version = "0.1.0"
description = "Cloud for small software — a generated app becomes a live, permissioned, shareable URL"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sqlmodel>=0.0.22",
    "docker>=7.1",
    "pydantic>=2.9",
]

[project.optional-dependencies]
# Only needed when DATABASE_URL points at Postgres; SQLite works out of the box.
postgres = [
    "psycopg[binary]>=3.2",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
]

[project.scripts]
hangar = "hangar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hangar"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: needs a running Docker daemon and builds real images",
]
